<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillSwapify</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <h2>SkillSwapify</h2>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#skills">Skills</a>
            <a href="#">Login</a>
        </div>

    </nav>


    <!-- Hero Section -->
    <section class="hero">

        <h1>
            Learn Skills.
            <br>
            <span>Share Skills.</span>
        </h1>

        <p>
            Connect with people, learn new skills,
            <br>
            and share what you know.
        </p>

        <button onclick="getStarted()">
            Get Started
        </button>

    </section>


    <!-- Skills Section -->
    <section id="skills" class="skills">

        <h2>Popular Skills</h2>

        <div class="skill-container">

            <div class="skill-card">
                <h3>💻 Web Development</h3>
                <p>Learn HTML, CSS and JavaScript.</p>
            </div>

            <div class="skill-card">
                <h3>🎨 Graphic Design</h3>
                <p>Learn designing and creative skills.</p>
            </div>

            <div class="skill-card">
                <h3>📸 Photography</h3>
                <p>Improve your photography skills.</p>
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
